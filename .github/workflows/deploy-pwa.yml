name: Deploy Web PWA

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'reel-studio/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base path for the PWA (e.g. /Spark-Love for GitHub Pages project site, or / for a custom domain)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ngehuqbzfzjeusshwubw.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_rn9gtb0eB2E5Du-85yfX2Q_rf8T9iNJ' }}
      EXPO_PUBLIC_TMDB_READ_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_READ_TOKEN }}
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
      EXPO_PUBLIC_BASE_URL: ${{ github.event.inputs.base_url != '' && github.event.inputs.base_url || vars.PWA_BASE_URL || '/Spark-Love' }}
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Export Web PWA
        run: bun run build:web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
