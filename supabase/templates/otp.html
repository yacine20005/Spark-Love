<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:24px 16px;color:#1F1A14">
  <h2 style="margin:0 0 12px;font-size:22px;letter-spacing:-0.01em">Your Spark Love sign-in code</h2>
  <p style="margin:0 0 20px;line-height:1.5;color:#52483E">Enter this code in the Spark Love app to sign in:</p>
  <div style="display:inline-block;padding:14px 22px;border-radius:12px;background:#F1EADB;border:1px solid #DDD2BC;font-size:32px;font-weight:700;letter-spacing:6px;font-variant-numeric:tabular-nums">
    {{ .Token }}
  </div>
  <p style="margin:20px 0 0;font-size:13px;line-height:1.5;color:#6E6256">
    This code expires in one hour. If you didn&rsquo;t request it, you can safely ignore this email.
  </p>
</div>
