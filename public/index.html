<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F1EADB" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#15120E" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spark Love" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: #F1EADB;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #15120E;
        }
      }
      body {
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      (function () {
        try {
          var pref = window.localStorage.getItem('spark-love.theme');
          if (pref === 'light' || pref === 'dark') {
            var bg = pref === 'dark' ? '#15120E' : '#F1EADB';
            document.documentElement.style.backgroundColor = bg;
            document.documentElement.style.colorScheme = pref;
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
              meta.setAttribute('content', bg);
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Spark Love.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && window.location.port !== '8081') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
